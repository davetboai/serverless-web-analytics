AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Serverless Web Analytics — zero-cost, privacy-first web analytics
  using DynamoDB, Lambda, CloudFront, and Cognito.

# ============================================================
# Parameters
# ============================================================
Parameters:
  AdminEmail:
    Type: String
    Description: Email address for the initial admin user (receives temporary password)
    AllowedPattern: ".+@.+"

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing packaged Lambda code (created by deploy.sh)

  CollectorCodeKey:
    Type: String
    Description: S3 key for collector Lambda zip
    Default: lambda/collector.zip

  QueryCodeKey:
    Type: String
    Description: S3 key for query Lambda zip
    Default: lambda/query.zip

  DomainName:
    Type: String
    Description: Custom domain for CloudFront (leave empty to use CloudFront domain)
    Default: ""

  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID (required if DomainName is set)
    Default: ""

  CertificateArn:
    Type: String
    Description: ACM certificate ARN in us-east-1 (required if DomainName is set)
    Default: ""

# ============================================================
# Conditions
# ============================================================
Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]

# ============================================================
# Resources
# ============================================================
Resources:

  # ----- Cognito User Pool & Client -----
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-dashboard"
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  AdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums:
        - EMAIL
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
        - Name: email_verified
          Value: "true"

  # ----- DynamoDB -----
  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ----- Collector Lambda -----
  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:GetItem
                Resource: !GetAtt EventsTable.Arn

  CollectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-collector"
      Runtime: python3.13
      Handler: index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref CollectorCodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref EventsTable
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt CollectorRole.Arn

  CollectorFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt CollectorFunction.Arn

  CollectorFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref CollectorFunction
      Principal: "*"
      FunctionUrlAuthType: NONE

  # ----- Query Lambda -----
  QueryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt EventsTable.Arn

  QueryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-query"
      Runtime: python3.13
      Handler: index.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref QueryCodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref EventsTable
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt QueryRole.Arn

  QueryFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref QueryFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${QueryApi}/*"

  # ----- HTTP API Gateway -----
  QueryApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type

  QueryApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref QueryApi
      StageName: "$default"
      AutoDeploy: true

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref QueryApi
      AuthorizerType: JWT
      Name: CognitoJWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
        Audience:
          - !Ref UserPoolClient

  QueryIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref QueryApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt QueryFunction.Arn
      PayloadFormatVersion: "2.0"

  # API Routes
  RouteQuery:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "GET /api/query"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteSitesGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "GET /api/sites"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteSitesPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "POST /api/sites"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteSitesPut:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "PUT /api/sites"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteSitesDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "DELETE /api/sites"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteLive:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "GET /api/live"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteEvents:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "GET /api/events"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteRecent:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "GET /api/recent"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteGoalsGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "GET /api/goals"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteGoalsPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "POST /api/goals"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteGoalsDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "DELETE /api/goals"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RoutePerf:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "GET /api/perf"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteCompare:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "GET /api/compare"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteFunnelsGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "GET /api/funnels"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteFunnelsPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "POST /api/funnels"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteFunnelsDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QueryApi
      RouteKey: "DELETE /api/funnels"
      Target: !Sub "integrations/${QueryIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  # ----- S3 Bucket for Dashboard + Tracker -----
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ----- CloudFront -----
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100

        # Custom domain (conditional)
        Aliases:
          !If
            - HasCustomDomain
            - - !Ref DomainName
            - !Ref "AWS::NoValue"
        ViewerCertificate:
          !If
            - HasCustomDomain
            - AcmCertificateArn: !Ref CertificateArn
              SslSupportMethod: sni-only
              MinimumProtocolVersion: TLSv1.2_2021
            - CloudFrontDefaultCertificate: true

        # SPA fallback — rewrite 403/404 to index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

        # Origins
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""

          - Id: CollectorOrigin
            DomainName: !Select
              - 2
              - !Split ["/", !GetAtt CollectorFunctionUrl.FunctionUrl]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2

          - Id: ApiOrigin
            DomainName: !Sub "${QueryApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2

        # Default behavior — S3 (dashboard)
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true

        CacheBehaviors:
          # /script.js — S3
          - PathPattern: /script.js
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true

          # /api/collect — Collector Lambda (public write path)
          - PathPattern: /api/collect
            TargetOriginId: CollectorOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true

          # /api/ingest — Collector Lambda (server-side events)
          - PathPattern: /api/ingest
            TargetOriginId: CollectorOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true

          # /api/query — API Gateway (read-only)
          - PathPattern: /api/query
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true

          # /api/sites — API Gateway (CRUD)
          - PathPattern: /api/sites
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true

          # /api/live
          - PathPattern: /api/live
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true

          # /api/events
          - PathPattern: /api/events
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true

          # /api/recent
          - PathPattern: /api/recent
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true

          # /api/goals
          - PathPattern: /api/goals
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true

          # /api/perf
          - PathPattern: /api/perf
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true

          # /api/compare
          - PathPattern: /api/compare
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true

          # /api/funnels
          - PathPattern: /api/funnels
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true

  # ----- Route53 (conditional) -----
  DnsRecordA:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront global hosted zone ID

  DnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

# ============================================================
# Outputs
# ============================================================
Outputs:
  DashboardUrl:
    Description: Dashboard URL
    Value: !If
      - HasCustomDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${Distribution.DomainName}"

  CloudFrontDomain:
    Description: CloudFront distribution domain
    Value: !GetAtt Distribution.DomainName

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !Ref Distribution

  TrackingSnippet:
    Description: HTML snippet to add to your website
    Value: !If
      - HasCustomDomain
      - !Sub '<script defer src="https://${DomainName}/script.js" data-website-id="YOUR_SITE_ID"></script>'
      - !Sub '<script defer src="https://${Distribution.DomainName}/script.js" data-website-id="YOUR_SITE_ID"></script>'

  SiteBucketName:
    Description: S3 bucket for dashboard and tracker assets
    Value: !Ref SiteBucket

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient

  TableName:
    Description: DynamoDB table name
    Value: !Ref EventsTable
